name: Full-Stack Release E2E

# 分级约定：真实 Chrome + 全栈 docker compose 的重流程只在「发布」时跑。
#   - PR / main 推送的快反馈由 frontend-ci.yml 与 attachment-browser-contract.yml 承担；
#   - 本工作流是 release 证据（tag v* 由根目录 release.sh 推送），也可手动触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-release-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ▼ 后端 revision 的唯一来源：被验证的 qtable-server 修订（v0.1.1-alpha）。
      #   改动时只改这一处——工作流的其余部分都从它派生，
      #   并把实际解析出的 SHA 写进 .release-e2e-artifacts/revisions.txt。
      #   必须是 QingZoneX/qtable-server 中真实存在的 ref（tag 或 40 位 SHA）。
      QTABLE_SERVER_REVISION: 86a348ecc843f2bc3eb1451a9cd4ddcd31defa49
      APP_ENV: production
      PASSWORD_RESET_DEBUG_TOKEN_ENABLED: "false"
      PASSWORD_RESET_RATE_LIMIT_ENABLED: "true"
      SMTP_HOST: ""
      POSTGRES_USER: release_e2e
      POSTGRES_PASSWORD: release-e2e-db-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: qtable_release_e2e
      ATTACHMENT_S3_ACCESS_KEY: releasee2eaccess${{ github.run_id }}
      ATTACHMENT_S3_SECRET_KEY: releasee2estorage${{ github.run_id }}${{ github.run_attempt }}
      ATTACHMENT_S3_BUCKET: qtable-release-e2e
      SECRET_KEY: release-e2e-jwt-${{ github.run_id }}-${{ github.run_attempt }}-qtable
      QTABLE_UI_CONTEXT: ..
      QTABLE_UI_PORT: "9100"
      QTABLE_API_PORT: "9000"
      POSTGRES_HOST_PORT: "5432"
      REDIS_HOST_PORT: "6379"
      MINIO_API_HOST_PORT: "9001"
      MINIO_CONSOLE_HOST_PORT: "9002"
      QTABLE_RELEASE_E2E_ALICE: release-alice-${{ github.run_id }}@example.com
      QTABLE_RELEASE_E2E_BOB: release-bob-${{ github.run_id }}@example.com
      QTABLE_RELEASE_E2E_PASSWORD: release-${{ github.run_id }}-${{ github.run_attempt }}-QTable
      QTABLE_E2E_ALICE_EMAIL: attachment-alice-${{ github.run_id }}@example.com
      QTABLE_E2E_BOB_EMAIL: attachment-bob-${{ github.run_id }}@example.com
      QTABLE_E2E_MANAGER_EMAIL: attachment-manager-${{ github.run_id }}@example.com
      QTABLE_E2E_PASSWORD: attachment-${{ github.run_id }}-${{ github.run_attempt }}-QTable

    steps:
      - name: Checkout QTableUI exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Export QTable backend exact revision
        uses: actions/checkout@v7
        with:
          repository: QingZoneX/qtable-server
          ref: ${{ env.QTABLE_SERVER_REVISION }}
          path: .e2e-backend
          fetch-depth: 1

      - name: Record exact tested revisions
        run: |
          set -euo pipefail
          ACTUAL_UI_SHA="$(git rev-parse HEAD)"
          ACTUAL_BACKEND_SHA="$(git -C .e2e-backend rev-parse HEAD)"
          test -f .e2e-backend/docker-compose.yml
          test -f .e2e-backend/app/main.py
          test -f .e2e-backend/requirements.txt
          mkdir -p .release-e2e-artifacts
          {
            echo "qtable-web=$ACTUAL_UI_SHA"
            echo "qtable-server=$ACTUAL_BACKEND_SHA"
            echo "qtable-server-requested=$QTABLE_SERVER_REVISION"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
          } | tee .release-e2e-artifacts/revisions.txt

      - name: Validate release gate source
        run: |
          python3 -m py_compile e2e/*.py
          python3 -m unittest discover -s e2e -p "test_*.py"

      - name: Reset previous stack state
        working-directory: .e2e-backend
        run: docker compose down -v --remove-orphans || true

      - name: Build and start canonical fresh stack
        working-directory: .e2e-backend
        run: docker compose up -d --build

      - name: Verify UI API database Redis and object storage health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if \
              curl --fail --silent http://127.0.0.1:9100/healthz >/dev/null && \
              curl --fail --silent http://127.0.0.1:9000/ >/dev/null && \
              curl --fail --silent http://127.0.0.1:9001/minio/health/live >/dev/null && \
              docker compose -f .e2e-backend/docker-compose.yml exec -T redis redis-cli ping | grep -q PONG && \
              docker compose -f .e2e-backend/docker-compose.yml exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null; then
              docker compose -f .e2e-backend/docker-compose.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -f .e2e-backend/docker-compose.yml ps
          docker compose -f .e2e-backend/docker-compose.yml logs --no-color
          exit 1

      - name: Run primary fresh-install two-user browser release gate
        run: |
          set -o pipefail
          python3 e2e/run_full_stack_release_gate.py \
            --base-url http://127.0.0.1:9100 \
            --artifacts .release-e2e-artifacts \
            2>&1 | tee .release-e2e-artifacts/release-browser-gate.log

      - name: Run private-cache browser regression gate
        run: |
          python3 e2e/run_service_worker_private_cache_gate.py \
            --result .release-e2e-artifacts/service-worker-result.json

      - name: Seed attachment permission fixture for full main/tag verification
        working-directory: .e2e-backend
        run: |
          docker compose exec -T \
            -e QTABLE_E2E_PASSWORD="$QTABLE_E2E_PASSWORD" \
            qtable python - < ../e2e/seed_attachment_release_gate.py

      - name: Run attachment upload refresh permission recycle purge lifecycle
        run: |
          python3 e2e/run_attachment_editor_release_gate.py \
            --base-url http://127.0.0.1:9100 \
            --result .release-e2e-artifacts/attachment-result.json

      - name: Verify registry and physical object purge
        working-directory: .e2e-backend
        run: |
          ATTACHMENT_ID="$(python3 -c 'import json; print(json.load(open("../.release-e2e-artifacts/attachment-result.json"))["attachmentId"])')"
          OBJECT_KEY="$(python3 -c 'import json; print(json.load(open("../.release-e2e-artifacts/attachment-result.json"))["objectKey"])')"
          docker compose exec -T qtable \
            python - "$ATTACHMENT_ID" "$OBJECT_KEY" \
            < ../e2e/verify_attachment_cleanup.py

      - name: Capture canonical stack logs on failure
        if: failure()
        run: |
          docker compose -f .e2e-backend/docker-compose.yml ps > .release-e2e-artifacts/compose-ps.txt || true
          docker compose -f .e2e-backend/docker-compose.yml logs --no-color > .release-e2e-artifacts/compose.log || true

      - name: Upload exact revision trace and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-release-e2e-${{ github.sha }}
          path: .release-e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down canonical stack and fresh volumes
        if: always()
        run: |
          if [ -f .e2e-backend/docker-compose.yml ]; then
            docker compose -f .e2e-backend/docker-compose.yml down -v --remove-orphans
          fi
