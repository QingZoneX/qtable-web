name: Attachment Full-Stack E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/attachment-e2e.yml"
      - ".dockerignore"
      - "e2e/**"
      - "src/components/SmartTable/attachments/**"
      - "src/components/SmartTable/editors/AttachmentEditor.tsx"
      - "src/components/SmartTable/editors/ReactEditor.tsx"
      - "src/components/SmartTable/renderers/renderAttachment.tsx"
  push:
    branches: [main]
    paths:
      - ".github/workflows/attachment-e2e.yml"
      - ".dockerignore"
      - "e2e/**"
      - "src/components/SmartTable/attachments/**"
      - "src/components/SmartTable/editors/AttachmentEditor.tsx"
      - "src/components/SmartTable/editors/ReactEditor.tsx"
      - "src/components/SmartTable/renderers/renderAttachment.tsx"

permissions:
  contents: read

jobs:
  attachment-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QTABLE_E2E_ALICE_EMAIL: attachment-e2e-alice@example.test
      QTABLE_E2E_BOB_EMAIL: attachment-e2e-bob@example.test
      QTABLE_E2E_MANAGER_EMAIL: attachment-e2e-manager@example.test
      QTABLE_E2E_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}-QTable
      ATTACHMENT_S3_ACCESS_KEY: e2eaccess${{ github.run_id }}
      ATTACHMENT_S3_SECRET_KEY: e2estorage${{ github.run_id }}${{ github.run_attempt }}
      ATTACHMENT_S3_BUCKET: qtable-browser-e2e
      SECRET_KEY: e2e-jwt-${{ github.run_id }}-${{ github.run_attempt }}-qtable
      QTABLE_UI_CONTEXT: ..
      QTABLE_UI_PORT: "9100"
      QTABLE_API_PORT: "9000"
      POSTGRES_HOST_PORT: "5432"
      REDIS_HOST_PORT: "6379"
      MINIO_API_HOST_PORT: "9001"
      MINIO_CONSOLE_HOST_PORT: "9002"
      QTABLE_BACKEND_SHA: 9b6fba5ff5a4ff906b655fbde949014816b1b6f3

    steps:
      - name: Checkout QTableUI exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Export QTable backend exact revision
        uses: QingZoneX/QTable/.github/actions/export-source@9b6fba5ff5a4ff906b655fbde949014816b1b6f3
        with:
          destination: .e2e-backend

      - name: Record exact revisions
        run: |
          echo "QTableUI=$(git rev-parse HEAD)"
          echo "QTable=$QTABLE_BACKEND_SHA"
          test -f .e2e-backend/docker-compose.yml
          test -f .e2e-backend/app/main.py

      - name: Build and start canonical full stack
        working-directory: .e2e-backend
        run: docker compose up -d --build

      - name: Wait for UI and backend health
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:9100/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:9000/ >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker compose -f .e2e-backend/docker-compose.yml ps
          docker compose -f .e2e-backend/docker-compose.yml logs --no-color
          exit 1

      - name: Seed permission-scoped attachment fixture
        working-directory: .e2e-backend
        run: |
          docker compose exec -T \
            -e QTABLE_E2E_PASSWORD="$QTABLE_E2E_PASSWORD" \
            qtable python - < ../e2e/seed_attachment_release_gate.py

      - name: Run real AttachmentEditor browser lifecycle
        run: |
          python3 e2e/run_attachment_editor_release_gate.py \
            --base-url http://127.0.0.1:9100 \
            --result .e2e-attachment-result.json

      - name: Verify registry and physical object purge
        working-directory: .e2e-backend
        run: |
          ATTACHMENT_ID="$(python3 -c 'import json; print(json.load(open("../.e2e-attachment-result.json"))["attachmentId"])')"
          OBJECT_KEY="$(python3 -c 'import json; print(json.load(open("../.e2e-attachment-result.json"))["objectKey"])')"
          docker compose exec -T qtable \
            python - "$ATTACHMENT_ID" "$OBJECT_KEY" \
            < ../e2e/verify_attachment_cleanup.py

      - name: Capture full-stack logs on failure
        if: failure()
        run: |
          if [ -f .e2e-backend/docker-compose.yml ]; then
            docker compose -f .e2e-backend/docker-compose.yml ps > attachment-compose-ps.txt || true
            docker compose -f .e2e-backend/docker-compose.yml logs --no-color > attachment-compose.log || true
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: attachment-full-stack-${{ github.sha }}
          path: |
            attachment-compose-ps.txt
            attachment-compose.log
            .e2e-attachment-result.json
          if-no-files-found: ignore

      - name: Tear down full stack
        if: always()
        run: |
          if [ -f .e2e-backend/docker-compose.yml ]; then
            docker compose -f .e2e-backend/docker-compose.yml down -v --remove-orphans
          fi
