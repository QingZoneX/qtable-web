name: Temporary i18n hardcoded copy audit

on:
  push:
    branches: [fix/i18n-final-closure]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit hardcoded CJK copy
        run: node scripts/audit-i18n-hardcoded.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: i18n-hardcoded-copy-${{ github.sha }}
          path: .i18n-audit/hardcoded-cjk.json
